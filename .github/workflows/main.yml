name: build & publish

on:
  workflow_dispatch:
  push:
    branches: ["solutions"]
    tags: ["*"]

permissions:
  packages: write

env:
  REGISTRY: ghcr.io/notalib
  IMAGE_BASE: ghcr.io/notalib/workshop-containerisation

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0
      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v4.0.0
        with:
          platforms: linux/amd64,linux/arm64
      - name: Login to registry ghcr.io
        uses: docker/login-action@v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: nota-ci
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push all images (multi-arch)
        run: |
          docker buildx bake --pull --push --set "*.platform=linux/amd64,linux/arm64" \
            ubuntu-debugger java-hello-world java-hello-world-pom dotnet-hello-world static-web-app micro-go-app edu-spring-boot
      - name: Add version tag from git tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          GIT_TAG="${GITHUB_REF#refs/tags/}"
          for svc in ubuntu-debugger java-hello-world java-hello-world-pom dotnet-hello-world static-web-app micro-go-app edu-spring-boot; do
            docker buildx imagetools create \
              -t "${{ env.IMAGE_BASE }}/${svc}:${GIT_TAG}" \
              "${{ env.IMAGE_BASE }}/${svc}:latest"
          done

  build-jupyter:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v4.0.0
      - name: Login to registry ghcr.io
        uses: docker/login-action@v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: nota-ci
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push python-jupyter-demo (amd64 only)
        run: docker buildx bake python-jupyter-demo --pull --push --set "python-jupyter-demo.platform=linux/amd64"
      - name: Add version tag from git tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          GIT_TAG="${GITHUB_REF#refs/tags/}"
          docker buildx imagetools create \
            -t "${{ env.IMAGE_BASE }}/python-jupyter-demo:${GIT_TAG}" \
            "${{ env.IMAGE_BASE }}/python-jupyter-demo:latest"
