services:

  backend:
    image: backend
    build: ./backend
    ports:
      - 8888:8080
    environment:
      - POSTGRES_DB=example
    secrets:
      - db-password
    networks:
      - spring-postgres

  db:
    image: postgres:18.3-alpine3.23
    restart: always
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - spring-postgres
    environment:
      - POSTGRES_DB=example
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    expose:
      - 5432

volumes:
  db-data:
secrets:
  db-password:
    file: db/password.txt

networks:
  spring-postgres:
