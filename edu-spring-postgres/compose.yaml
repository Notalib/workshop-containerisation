services:

  backend:
    image: ghcr.io/notalib/workshop-containerisation/spring-postgres
    build: ./backend
    restart: unless-stopped
    ports:
      - 8888:8080
    environment:
      - POSTGRES_DB=example
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    secrets:
      - db-password
    depends_on:
      - db
    networks:
      - spring-postgres

  db:
    image: postgres:18.3-alpine3.23
    restart: unless-stopped
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=example
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    networks:
      - spring-postgres
    expose:
      - 5432

volumes:
  db-data:
secrets:
  db-password:
    file: db/password.txt

networks:
  spring-postgres:
