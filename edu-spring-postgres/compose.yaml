services:

  backend:
    image: ghcr.io/notalib/workshop-containerisation/spring-postgres
    build: ./backend
    restart: unless-stopped
    ports:
      - 8888:8080
    environment:
      - POSTGRES_DB=example
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_PASSWORD=db-wrz2z
      # DB is always available in compose, so override the K8s-safe defaults:
      # create schema via Hibernate, then run schema.sql + data.sql for seed data.
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_SQL_INIT_MODE=always
      - SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION=true
    depends_on:
      - db

  db:
    image: postgres:18.3-alpine3.23
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=example
      - POSTGRES_PASSWORD=db-wrz2z
    expose:
      - 5432

volumes:
  db-data:
