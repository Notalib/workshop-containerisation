services:
  ubuntu-debugger:
    build: ./1-ubuntu-debugger # Folder containing the Dockerfile, also known as the build context
    image: ghcr.io/notalib/workshop-containerisation/ubuntu-debugger # The name of the image to be built, in the format <repository>/<image-name>:<tag>

  java-hello-world:
    build:
      context: ./2-java-hello-world
      dockerfile: Dockerfile.good
    image: ghcr.io/notalib/workshop-containerisation/java-hello-world

  java-hello-world-pom:
    build:
      context: ./3-java-hello-world-pom
      dockerfile: Dockerfile.good
    image: ghcr.io/notalib/workshop-containerisation/java-hello-world-pom

  dotnet-hello-world:
    build:
      context: ./4-dotnet-hello-world
      dockerfile: Dockerfile.good
    image: ghcr.io/notalib/workshop-containerisation/dotnet-hello-world
    environment:
      - DOTNET_ENVIRONMENT=Production

  static-web-app:
    build:
      context: ./5-static-web-app
      dockerfile: Dockerfile # Replace with Dockerfile-smaller if you want to use the smaller image
    image: ghcr.io/notalib/workshop-containerisation/static-web-app
    ports:
      - "127.0.0.1:8080:80"

  micro-go-app:
    build: ./edu-micro-go-app
    image: ghcr.io/notalib/workshop-containerisation/micro-go-app

  python-jupyter-demo:
    build:
      context: ./6-python-jupyter
      dockerfile: Dockerfile.solution
    image: ghcr.io/notalib/workshop-containerisation/python-jupyter-demo
    volumes:
      - ./6-python-jupyter/notebooks:/app
    ports:
      - "127.0.0.1:8888:8888"

  edu-spring-boot:
    build:
      context: edu-spring-postgres/backend
    image: ghcr.io/notalib/workshop-containerisation/edu-spring-boot
